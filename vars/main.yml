---
role_name: "ansible-role-openvpn"

_openvpn_etc: "/etc/openvpn"
_openvpn_pkgs:
  server:
    - openvpn
  client:
    - openvpn
  pki_master:
    - easy-rsa
  common:
    - tar
openvpn_pkgs: "{{ _openvpn_pkgs['common'] + _openvpn_pkgs[openvpn_role] + ( _openvpn_pkgs['pki_master'] if openvpn_pki_manager else [] ) }}"

openvpn_base_path: "{{ _openvpn_etc ~ '/' ~ openvpn_role ~ '/' }}"
openvpn_config_path: "{{ openvpn_base_path ~ (openvpn_name if openvpn_name is defined and openvpn_name|length > 0 else '') }}"
openvpn_config_pki_path: "{{ _openvpn_etc ~ '/pki/' ~ (openvpn_name if openvpn_name is defined and openvpn_name|length > 0 else '') }}"
openvpn_config_pki_dist_path: "{{ openvpn_config_pki_path }}/dist"

openvpn_pki_client_prefix: "client-"
openvpn_pki_server_prefix: "server-"

openvpn_easyrsa_bin_path: "/usr/share/easy-rsa/3/easyrsa"
openvpn_temp_dist: "/tmp/"

openvpn_server_addresse_pool: "10.8.0.0 255.255.255.0"

openvpn_temp_dir: "/tmp"
